<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gevento Products API - Swagger UI</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.18.2/swagger-ui.css" />
  <style>
    body {
      margin: 0;
      background: #fafafa;
    }
    .topbar-custom {
      background: #0f172a;
      color: #f8fafc;
      padding: 14px 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
    }
    .topbar-custom h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
    }
    .topbar-custom .links a {
      color: #38bdf8;
      text-decoration: none;
      margin-left: 16px;
      font-size: 13px;
      font-weight: 500;
    }
    .topbar-custom .links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="topbar-custom">
    <h1>Gevento Backend — Documentación Interactiva Swagger (OpenAPI 3.0)</h1>
    <div class="links">
      <a href="./openapi.json" target="_blank">OpenAPI JSON</a>
      <a href="./openapi.yaml" target="_blank">OpenAPI YAML</a>
      <a href="./postman_collection.json" target="_blank">JSON Postman</a>
      <a href="./insomnia_collection.json" target="_blank">JSON Insomnia</a>
      <a href="./DOCUMENTACION_API.md" target="_blank">Documento Técnico</a>
      <a href="/products" target="_blank">GET /products</a>
    </div>
  </div>
  <div id="swagger-ui"></div>

  <script src="https://unpkg.com/swagger-ui-dist@5.18.2/swagger-ui-bundle.js" crossorigin></script>
  <script src="https://unpkg.com/swagger-ui-dist@5.18.2/swagger-ui-standalone-preset.js" crossorigin></script>
  <script>
    window.onload = function () {
      window.ui = SwaggerUIBundle({
        url: "./openapi.json",
        dom_id: "#swagger-ui",
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        layout: "BaseLayout",
        docExpansion: "list",
        defaultModelsExpandDepth: 1,
        tryItOutEnabled: true
      });
    };
  </script>
</body>
</html>
